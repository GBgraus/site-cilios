<!DOCTYPE html>

<body>
<header>
<h1>🎅 Agendamento de Natal</h1>
<nav>
<a href="index.html">Home</a>
<a href="galeria.html">Galeria</a>
</nav>
</header>





<form id="agendamentoForm">
  <h2>Agende Seu Procedimento</h2>



<label>Tipo de cílios:</label>
<select id="tipo">
<option>Fio a Fio</option>
<option>Volume Brasileiro</option>
<option>Volume Russo</option>
<option>Volume Egípcio</option>
<option>Manutenção</option>
<option>Desing de sobrancelha</option>
<option>Depilação</option>
<option>Limpeza de pele</option>
</select>


<label>Data desejada:</label>
<input type="date" id="data" required>


<label>Local onde mora:</label>
<input type="text" id="local" placeholder="Seu bairro e nome da rua" required>



<button type="submit">Agendar</button>
</form>
<a id="btnZap" style="display:none;" target="_blank"></a>

<button id="addCalendar">Salvar no Calendário</button>


<script src="script.js"></script>
</body>
</html>
