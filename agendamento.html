<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agendamento - Leh Lash Desing</title>
<link rel="stylesheet" href="style.css">

<body>
<header>
<h1>🎅 Agendamento de Natal</h1>
<nav>
<a href="index.html">Home</a>
<a href="galeria.html">Galeria</a>
</nav>
</header>


<section class="formulario">
<h2>Agende Seu Procedimento</h2>


<form id="agendamentoForm">
<label>Tipo de cílios:</label>
<select id="tipo">
<option>Clássico</option>
<option>Híbrido</option>
<option>Volume Russo</option>
<option>Manutenção</option>
</select>


<label>Data desejada:</label>
<input type="date" id="data" required>


<label>Local onde mora:</label>
<input type="text" id="local" placeholder="Seu bairro ou cidade" required>


<button type="submit">Enviar via WhatsApp</button>
</form>


<button id="addCalendar">Salvar no Calendário</button>
</section>

<script src="script.js"></script
</body>
</html>
